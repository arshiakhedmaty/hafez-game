<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HAFEZ GAME — Character Design Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#1b1026;color:#efdcb0;
            font-family:"Special Elite","Courier New",monospace;}
  header{padding:18px 24px 6px;text-align:center}
  h1{font-family:"Rye",Georgia,serif;font-size:30px;margin:0;letter-spacing:2px;
     color:#ffd66b;text-shadow:0 3px 0 #160d1c}
  p.sub{margin:6px 0 0;opacity:.75;font-size:14px}
  #wrap{display:flex;justify-content:center;padding:10px}
  canvas{background:#241543;border:3px solid #7a4a2b;border-radius:6px;
         box-shadow:0 12px 40px rgba(0,0,0,.6);image-rendering:auto;max-width:98vw;height:auto}
  .keys{text-align:center;font-size:13px;opacity:.7;padding:8px}
  b{color:#e2b043}
</style>
</head>
<body>
<header>
  <h1>HAFEZ GAME</h1>
  <p class="sub">character design preview &mdash; ARSHIA &amp; ROJINA</p>
</header>
<div id="wrap"><canvas id="cv" width="1280" height="760"></canvas></div>
<div class="keys">press <b>SPACE</b> to cycle expressions &nbsp;·&nbsp; <b>1&ndash;6</b> to change the pose</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/art.js"></script>
<script>
const cv = document.getElementById('cv'), c = cv.getContext('2d');
const EXPR  = ['normal','happy','love','determined','scared','wink'];
const ANIMS = ['idle','run','jump','fall','cheer','aim'];
let ei = 0, ai = 0, T = 0;

addEventListener('keydown', e => {
  if (e.code === 'Space') { ei = (ei + 1) % EXPR.length; e.preventDefault(); }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 6) ai = n - 1;
});

function sky() {
  const g = c.createLinearGradient(0, 0, 0, cv.height);
  g.addColorStop(0.00, PAL.skyTop);
  g.addColorStop(0.30, PAL.skyHigh);
  g.addColorStop(0.55, PAL.skyMid);
  g.addColorStop(0.80, PAL.skyLow);
  g.addColorStop(1.00, PAL.skyHaze);
  c.fillStyle = g; c.fillRect(0, 0, cv.width, cv.height);
  /* sun */
  const sy = cv.height * 0.62;
  c.save(); c.globalAlpha = .35;
  for (let i = 6; i > 0; i--) { ell(c, cv.width / 2, sy, 120 + i * 26, 120 + i * 26); c.fillStyle = PAL.sun; c.globalAlpha = .05; c.fill(); }
  c.restore();
  ell(c, cv.width / 2, sy, 118, 118); c.fillStyle = PAL.sun; c.fill();
  ell(c, cv.width / 2, sy, 96, 96); c.fillStyle = PAL.sunCore; c.fill();
  /* ground */
  c.fillStyle = PAL.ground; c.fillRect(0, cv.height - 92, cv.width, 92);
  c.fillStyle = PAL.groundTop; c.fillRect(0, cv.height - 92, cv.width, 5);
}

function panel(x, y, w, h) {
  rr(c, x, y, w, h, 8);
  c.fillStyle = 'rgba(22,13,28,0.45)'; c.fill();
  c.lineWidth = 2; c.strokeStyle = 'rgba(239,220,176,0.28)'; c.stroke();
}

function frame(dt) {
  T += dt;
  sky();

  const groundY = cv.height - 96;
  const expr = EXPR[ei], anim = ANIMS[ai];

  /* ---- full body, big enough to actually judge ---- */
  const S = 7.2;
  drawChar(c, 'arshia', { x: 250, y: groundY, face: 1, anim, t: T, expr,
                          scale: S, speed: 1, blinkSeed: 0 });
  drawChar(c, 'rojina', { x: 470, y: groundY, face: -1, anim, t: T + 0.7, expr,
                          scale: S, speed: 1, blinkSeed: 0.45, closeness: 0.8 });

  [['ARSHIA', 250, LOOK.arshia.accent], ['ROJINA', 470, LOOK.rojina.accent]]
    .forEach(([n, x, col]) => {
      c.save();
      const w = 120, h = 28;
      rr(c, x - w / 2, groundY + 16, w, h, 5);
      c.fillStyle = 'rgba(22,13,28,0.7)'; c.fill();
      c.lineWidth = 2; c.strokeStyle = col; c.stroke();
      txt(c, n, x, groundY + 31, { size: 15, font: FONT.title, fill: col, letter: 2 });
      c.restore();
    });

  /* ---- heads, blown right up: this is where the craft shows ---- */
  panel(700, 56, 546, 400);
  txt(c, 'HEADS AT 11x', 973, 82, { size: 14, font: FONT.title, fill: PAL.parch, letter: 3 });
  c.save();
  c.beginPath(); c.rect(704, 96, 538, 352); c.clip();
  /* park the head in the middle of the box: the head centre sits
     H * 0.83 above the feet, so push the feet down by that much */
  const HZ = 11, boxMid = 250;
  const feet = (who, k) => boxMid + LOOK[who].height * 0.83 * k;
  drawChar(c, 'arshia', { x: 838, y: feet('arshia', HZ), face: 1, anim: 'idle',
                          t: T, expr, scale: HZ, shadow: false, blinkSeed: 0 });
  drawChar(c, 'rojina', { x: 1112, y: feet('rojina', HZ), face: -1, anim: 'idle',
                          t: T + 0.7, expr, scale: HZ, shadow: false, blinkSeed: 0.45 });
  c.restore();

  /* ---- read-out ---- */
  panel(24, 56, 240, 128);
  txt(c, 'EXPRESSION', 144, 80, { size: 12, font: FONT.title, fill: PAL.parchDk, letter: 2 });
  txt(c, expr.toUpperCase(), 144, 106, { size: 21, font: FONT.title, fill: PAL.gold });
  txt(c, 'POSE', 144, 138, { size: 12, font: FONT.title, fill: PAL.parchDk, letter: 2 });
  txt(c, anim.toUpperCase(), 144, 164, { size: 21, font: FONT.title, fill: PAL.gold });

  /* ---- portraits ---- */
  panel(700, 476, 546, 236);
  txt(c, 'PORTRAITS', 973, 500, { size: 13, font: FONT.title, fill: PAL.parch, letter: 3 });
  drawPortrait(c, 'arshia', 840, 600, 82, expr, T);
  drawPortrait(c, 'rojina', 1110, 600, 82, expr, T + 0.7);
  txt(c, LOOK.arshia.nameFa + '  ARSHIA', 840, 690,
      { size: 13, font: FONT.body, fill: LOOK.arshia.accent });
  txt(c, LOOK.rojina.nameFa + '  ROJINA', 1110, 690,
      { size: 13, font: FONT.body, fill: LOOK.rojina.accent });
}

let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  frame(dt);
  requestAnimationFrame(loop);
})(performance.now());
</script>
</body>
</html>
